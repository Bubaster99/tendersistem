# Рабочий сервер. Все настройки — в .env (образец: .env.production.example).
#   Запустить / обновить:  docker compose -f docker-compose.prod.yml up -d --build
#   Журнал сайта:          docker compose -f docker-compose.prod.yml logs -f app
# Наружу открыт только Caddy (порты 80 и 443): он выдаёт HTTPS. База и сайт снаружи недоступны.
name: tender

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tender
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: tender
      TZ: Europe/Moscow
      PGTZ: Europe/Moscow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tender -d tender"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tender:${POSTGRES_PASSWORD}@db:5432/tender?schema=public
      UPLOAD_DIR: /app/uploads
      NODE_ENV: production
      TZ: Europe/Moscow
    volumes:
      - uploads:/app/uploads

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Задайте DOMAIN в .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Ежедневный бэкап базы и файлов в 03:00 по Москве, хранится BACKUP_KEEP_DAYS дней (по умолчанию 14).
  # Если заполнены BACKUP_S3_* — копия ещё и в облачное хранилище в РФ.
  backup:
    build:
      context: .
      dockerfile: deploy/backup.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      PGHOST: db
      PGUSER: tender
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: tender
      TZ: Europe/Moscow
    volumes:
      - ./backups:/backups
      - uploads:/uploads:ro

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
