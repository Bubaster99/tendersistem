# Запуск для разработки: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tender
      POSTGRES_PASSWORD: tender
      POSTGRES_DB: tender
      TZ: Europe/Moscow
      PGTZ: Europe/Moscow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tender -d tender"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://tender:tender@db:5432/tender?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-secret-change-me-in-env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-aiag22msk@gmail.com}
      UPLOAD_DIR: /app/uploads
      NODE_ENV: development
      TZ: Europe/Moscow
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      # Загруженные файлы (документы тендеров, картинки) — отдельный том на сервере.
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
